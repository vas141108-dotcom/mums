<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mum's 44th & Fabulous Birthday Dreamhouse 💖</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --barbie-pink: #ff1493;
      --barbie-hot-pink: #e0007b;
      --barbie-soft-pink: #fff0f6;
      --barbie-light-pink: #ffb6c1;
      --barbie-gold: #ffd700;
      --barbie-dark: #2c001e;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 15px 35px rgba(255, 20, 147, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
      color: var(--barbie-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #sprinkle-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;
    }

    header {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--barbie-light-pink);
      position: sticky; top: 0; z-index: 100;
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 20px rgba(255, 20, 147, 0.08);
      flex-wrap: wrap; gap: 1rem;
    }

    .brand {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem; color: var(--barbie-pink); font-weight: 700;
    }

    .nav-tabs { display: flex; gap: 0.8rem; flex-wrap: wrap; }

    .tab-btn {
      background: transparent; border: 2px solid var(--barbie-pink); color: var(--barbie-pink);
      padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 700; cursor: pointer;
      transition: all 0.3s ease; display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--barbie-pink); color: white;
      box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4); transform: translateY(-2px);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .tab-content { display: none; animation: fadeIn 0.5s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      text-align: center; padding: 3rem 1rem;
      background: rgba(255, 255, 255, 0.6); border-radius: 30px;
      border: 2px solid white; box-shadow: var(--card-shadow); margin-bottom: 3rem;
    }

    .hero-badge {
      display: inline-block; background: var(--barbie-pink); color: white;
      padding: 0.5rem 1.5rem; border-radius: 50px; font-weight: 800;
      font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem;
    }

    .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--barbie-hot-pink); margin-bottom: 0.5rem; }
    .hero p { font-size: 1.2rem; color: #666; max-width: 600px; margin: 0 auto 2rem; }

    .bouquet-wrapper { display: inline-block; cursor: pointer; margin: 1.5rem 0; user-select: none; }
    .bouquet-svg {
      width: 180px; height: 180px; filter: drop-shadow(0 10px 15px rgba(255, 20, 147, 0.3));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .bouquet-wrapper:hover .bouquet-svg { animation: shake 0.5s infinite alternate; }

    @keyframes shake {
      0% { transform: rotate(-6deg) scale(1.05); }
      100% { transform: rotate(6deg) scale(1.05); }
    }

    .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.4rem; color: var(--barbie-dark); margin-bottom: 2rem; }

    .comparison-container { max-width: 750px; margin: 0 auto 4rem; background: white; padding: 1.5rem; border-radius: 25px; box-shadow: var(--card-shadow); }
    .comparison-slider { position: relative; width: 100%; height: 450px; overflow: hidden; border-radius: 18px; cursor: ew-resize; }
    .comparison-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-overlay { width: 50%; z-index: 2; border-right: 4px solid var(--barbie-pink); }
    .slider-handle { position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: var(--barbie-pink); z-index: 3; transform: translateX(-50%); }
    .slider-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; background: var(--barbie-pink); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .upload-controls { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }

    .btn-primary {
      background: var(--barbie-pink); color: white; border: none; padding: 0.8rem 1.6rem;
      border-radius: 50px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
      transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5s;
    }
    .btn-primary:hover { background: var(--barbie-hot-pink); transform: translateY(-2px); }

    .btn-secondary {
      background: var(--barbie-soft-pink); color: var(--barbie-pink); border: 1px solid var(--barbie-light-pink);
      padding: 0.6rem 1.2rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-secondary:hover { background: var(--barbie-light-pink); color: white; }

    /* Photobooth Styling */
    .photobooth-container { max-width: 800px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 30px; box-shadow: var(--card-shadow); text-align: center; }
    .camera-frame-wrapper {
      position: relative; width: 100%; max-width: 560px; margin: 0 auto 1.5rem;
      border-radius: 20px; overflow: hidden; background: #222; border: 5px solid var(--barbie-pink);
      box-shadow: 0 10px 25px rgba(255, 20, 147, 0.3); min-height: 380px; display: flex; align-items: center; justify-content: center;
    }
    #webcam { width: 100%; height: 380px; object-fit: cover; display: block; transform: scaleX(-1); }
    .camera-error-msg { color: #ff6b6b; padding: 1.5rem; font-weight: 600; display: none; line-height: 1.6; }
    
    .booth-overlay-badge {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 20, 147, 0.85); color: white; padding: 0.4rem 1.2rem;
      border-radius: 50px; font-weight: 700; font-size: 0.9rem; z-index: 10; pointer-events: none;
    }
    .countdown-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      font-size: 5rem; color: white; font-weight: 800; font-family: 'Playfair Display', serif;
      z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .countdown-overlay.active { opacity: 1; }

    .booth-controls { display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
    .frame-select { padding: 0.6rem 1.2rem; border-radius: 50px; border: 2px solid var(--barbie-pink); background: white; color: var(--barbie-dark); font-weight: 600; cursor: pointer; }

    .captured-strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .strip-card { background: white; padding: 0.8rem 0.8rem 1.5rem 0.8rem; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 2px solid var(--barbie-light-pink); }
    .strip-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 0.8rem; }

    /* Letter styling */
    .letter-container { max-width: 750px; margin: 0 auto; background: white; padding: 3rem; border-radius: 25px; box-shadow: var(--card-shadow); border: 3px solid var(--barbie-light-pink); }
    .envelope-cover { text-align: center; padding: 3rem 1rem; background: var(--barbie-soft-pink); border-radius: 18px; border: 2px dashed var(--barbie-pink); cursor: pointer; }
    .envelope-cover i { font-size: 4rem; color: var(--barbie-pink); margin-bottom: 1rem; }
    .letter-content { display: none; }
    .letter-content.open { display: block; animation: fadeIn 0.8s ease; }
    .letter-body { font-family: 'Playfair Display', serif; font-size: 1.2rem; line-height: 1.9; color: #333; white-space: pre-wrap; outline: none; padding: 1rem; border-radius: 12px; }
