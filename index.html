<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mum's 44th Birthday 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: linear-gradient(135deg, #fff0f5 0%, #ffd1dc 100%); color: #2c001e; min-height: 100vh; padding: 2rem; text-align: center; }
    header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(255,20,147,0.1); margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #ff1493; }
    .nav-tabs { display: flex; gap: 0.5rem; }
    .tab-btn { background: transparent; border: 2px solid #ff1493; color: #ff1493; padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .tab-btn.active, .tab-btn:hover { background: #ff1493; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .photobooth-box { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 25px; box-shadow: 0 10px 30px rgba(255,20,147,0.2); }
    .video-wrap { position: relative; width: 100%; height: 380px; background: #111; border-radius: 15px; overflow: hidden; border: 4px solid #ff1493; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .btn-pink { background: #ff1493; color: white; border: none; padding: 0.8rem 1.8rem; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 15px rgba(255,20,147,0.4); }
    .btn-pink:hover { background: #e0007b; }
    .error-txt { color: #ff4d4d; padding: 1rem; font-weight: 600; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Mum's 44th Birthday 💖</div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('home')">Home</button>
      <button class="tab-btn" onclick="switchTab('photobooth')">Photobooth</button>
    </nav>
  </header>

  <main>
    <!-- HOME -->
    <div id="home-tab" class="tab-content active">
      <h1 style="font-family:'Playfair Display',serif; font-size:3rem; color:#e0007b; margin-bottom:1rem;">Happy 44th Birthday, Mum!</h1>
      <p style="font-size:1.2rem; color:#555;">Click the Photobooth tab above to take your photos!</p>
    </div>

    <!-- PHOTOPHOTOBOOTH -->
    <div id="photobooth-tab" class="tab-content">
      <div class="photobooth-box">
        <h2 style="font-family:'Playfair Display',serif; color:#ff1493; margin-bottom:1rem;">Birthday Photobooth 📸</h2>
        <div class="video-wrap">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="cam-error" class="error-txt" style="display:none;">
            Camera permission is required.<br><br>
            <button class="btn-pink" onclick="initCamera()">Allow Camera Access</button>
          </div>
        </div>
        <button class="btn-pink" onclick="takeSnapshot()">Snap Photo!</button>
      </div>
    </div>
  </main>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if(tab === 'home') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('home-tab').classList.add('active');
        stopCamera();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('photobooth-tab').classList.add('active');
        initCamera();
      }
    }
